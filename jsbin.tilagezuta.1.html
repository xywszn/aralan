<style id="jsbin-css">
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F3FB; --surface:#FFFFFF; --surface2:#F7F8FD; --ink:#1B2140; --muted:#586088; --line:#DADFF0;
  --brand:#2B3A9F; --on-brand:#FFFFFF; --hl:#FFE45E; --on-hl:#1B2140;
  --ok:#1C7F54; --ok-bg:#E3F5EC; --bad:#B93434; --bad-bg:#FBE7E7; --warn-bg:#FFF4D6;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c:#3D6FE0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#1A1F40; --surface2:#151935; --ink:#E9EBFB; --muted:#A0A7CE; --line:#2B3260;
    --brand:#9AA7FF; --on-brand:#11142A; --ok:#5FD6A0; --ok-bg:#12352A; --bad:#FF8C8C; --bad-bg:#3B1B22; --warn-bg:#3A3316;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#1A1F40; --surface2:#151935; --ink:#E9EBFB; --muted:#A0A7CE; --line:#2B3260;
  --brand:#9AA7FF; --on-brand:#11142A; --ok:#5FD6A0; --ok-bg:#12352A; --bad:#FF8C8C; --bad-bg:#3B1B22; --warn-bg:#3A3316;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:100%;max-width:1200px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:24px 16px 24px 20px}
.brand{font:800 30px/1 var(--display);letter-spacing:-.02em;margin:0 0 4px;display:inline-block;background:linear-gradient(transparent 62%,var(--hl) 62% 92%,transparent 92%);padding:0 4px;margin-left:-4px;color:var(--ink)}
.tag{margin:6px 0 20px;color:var(--muted);font-size:14px}
.subjects{display:flex;flex-direction:column;gap:6px}
.subj{--c:#3D6FE0;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:4px 12px 12px 4px;
  padding:10px 12px;font-weight:600;transition:transform .12s ease,background .12s ease}
.subj:hover{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.subj[aria-current="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface));transform:translateX(6px);border-color:var(--c)}
.subj .n{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.addsubj{margin-top:10px}
.addsubj form{display:flex;gap:6px}
.addsubj input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.linkbtn{background:none;border:none;color:var(--brand);font-weight:600;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.sidefoot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:14px}
.sidefoot p{margin:6px 0 0;color:var(--muted);font-size:13px}

.main{padding:24px 20px 60px 8px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:6px solid var(--c);padding-bottom:10px;margin-bottom:18px}
.head h1{margin:0;font:800 clamp(28px,5vw,42px)/1.05 var(--display);letter-spacing:-.02em}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tab{border:none;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font:700 19px/1.2 var(--display);margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.scope{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.scope-label{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
textarea,.field{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;resize:vertical;line-height:1.5}
textarea{min-height:150px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.primary{background:var(--brand);color:var(--on-brand);border:none;border-radius:10px;padding:10px 20px;font-weight:700}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.danger{color:var(--bad)}

.notice{background:var(--warn-bg);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.thinking{display:flex;align-items:center;gap:12px;padding:16px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c);animation:pulse 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}.subj{transition:none}}

.result{border-left:8px solid var(--c);padding:18px}
.cov{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.cov.full{background:var(--ok-bg);color:var(--ok)}
.cov.partial,.cov.none{background:var(--warn-bg)}
.answer{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.letter{flex:none;min-width:48px;height:48px;padding:0 10px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 26px/1 var(--display)}
.atext{font-size:19px;font-weight:700;line-height:1.35;padding-top:2px}
.result h3{font:700 15px/1.2 var(--display);margin:18px 0 6px;color:var(--muted)}
.result p{margin:0 0 8px}
.others{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.others li{display:flex;gap:10px;font-size:15px}
.others b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.src{margin:0;padding:12px 14px;background:var(--surface2);border-radius:10px;font-size:15px}
mark{background:var(--hl);color:var(--on-hl);padding:1px 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.srcmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}

.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.hist button{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:baseline}
.hist .hq{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .ha{flex:none;font-weight:700;color:var(--c)}

.lessons{display:grid;gap:10px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.lesson-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--c);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.lesson h3{margin:0;font:700 17px/1.25 var(--display)}
.lesson p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson .row{gap:6px}
.form-grid{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:10px 0}
.form-grid label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.empty{padding:26px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.q-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.q h3{margin:0 0 10px;font:600 17px/1.4 var(--body)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt b{flex:none;width:26px}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:8px 0;font-weight:700}
.weak{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.weak span{background:var(--bad-bg);border-radius:999px;padding:3px 12px;font-size:14px}

dialog{border:none;border-radius:16px;padding:0;width:min(720px,94vw);max-height:88%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,14,40,.4)}
dialog::backdrop{background:rgba(10,14,40,.55)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-head h2{margin:0;font:700 18px/1.2 var(--display);flex:1}
.dlg-body{padding:16px 20px 24px;white-space:pre-wrap;font-size:15.5px;line-height:1.65;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;padding:16px 16px 0}
  .tag{margin-bottom:12px}
  .subjects{flex-direction:row;overflow-x:auto;padding-bottom:8px;gap:8px}
  .subj{width:auto;flex:none;border-left-width:1px;border-top:6px solid var(--c);border-radius:10px}
  .subj[aria-current="true"]{transform:none}
  .sidefoot{flex-direction:row;flex-wrap:wrap;gap:12px;margin-top:8px}
  .sidefoot p{display:none}
  .main{padding:16px}
  .form-grid{grid-template-columns:1fr}
}
</style>

<div class="app">
  <aside class="side">
    <h1 class="brand">Aralan</h1>
    <p class="tag">Study with your own lessons</p>
    <nav aria-label="Subjects"><div class="subjects" id="subjects"></div></nav>
    <div class="addsubj" id="addsubj"></div>
    <div class="sidefoot">
      <button class="linkbtn" id="backup" type="button">Back up my lessons</button>
      <button class="linkbtn" id="restore" type="button">Restore a backup</button>
      <input type="file" id="restoreFile" accept=".json,application/json" class="sr" tabindex="-1">
      <p id="storeNote">Lessons are saved in this browser only.</p>
    </div>
  </aside>
  <main class="main" id="main" style="--c:#3D6FE0"></main>
</div>

<dialog id="reader" aria-labelledby="readerTitle">

  <div class="dlg-body" id="readerBody"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script id="jsbin-javascript">
(function(){
'use strict';

/* Aralan - study with your own lessons. Runs in the browser; answers come from /api/ask. */
/* ---------- helpers ---------- */
var $ = function(s, el){ return (el||document).querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var norm = function(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); };
var COLORS = ['#D9822B','#C4457A','#2E9E6B','#3D6FE0','#7A4FD0','#E0523E','#1E9CB0','#8A6D1F','#B24BD1','#4C8C2B'];
var DEFAULT_SUBJECTS = ['Social Studies','English','LifeLabs','Math','Science','MAPEH','Filipino'];
var KEY = 'aralan:v1';
var storageOK = true;

/* ---------- starter lesson (Social Studies EG 6) ---------- */
var EG6 = "SOCIAL STUDIES 10 - EXPERIENCE GUIDE 6: RESPONSES TO ENVIRONMENTAL CHALLENGES - PART 2 (Grade 10, Term 1)\n\n"+
"OVERVIEW\nIn EG 5, we learned about the international frameworks (UNEP, 2030 Agenda) and the three key Philippine environmental laws - RA 9003, RA 9275, and RA 8749. But knowing a law exists is very different from understanding how it works in practice. In this Experience Guide, learners will move from legal knowledge to legal literacy - applying the three laws to real scenarios, evaluating why enforcement gaps exist, analyzing the power of local government ordinances as a frontline tool, and developing their own capacity to act as informed, rights-aware citizens.\n\n"+
"OBJECTIVES\n1. Apply RA 9003, RA 9275, and RA 8749 to real-life environmental scenarios.\n2. Evaluate the reasons why environmental law enforcement remains weak in the Philippines.\n3. Analyze the role of local ordinances as a frontline tool for environmental protection.\n4. Demonstrate awareness of citizens' rights and remedies under Philippine environmental law.\n\n"+
"ESSENTIAL QUESTION\nWhat good is an environmental law if no one enforces it - and what can ordinary citizens do about that?\n\n"+
"EXPERIENCE 1: APPLYING THE LAWS - FROM TEXT TO REAL LIFE\nEssential ideas:\nA law is only meaningful when it is understood, applied, and enforced. Legal literacy - knowing which law applies, what it requires, and what remedies it provides - is a basic civic skill.\nRA 9003 (solid waste), RA 9275 (clean water), and RA 8749 (clean air) each cover specific types of environmental violations and assign specific responsibilities to different actors.\nCitizens who know their rights under these laws are empowered to demand action from local governments, report violations to regulatory agencies, and seek legal remedies when harmed.\n\n"+
"Scenario 1: The Burning Garbage. Every morning at 6:00 AM, the caretaker of a private school burns the school's daily garbage in an open pit at the back of the campus. Black smoke drifts into nearby residential houses. Several elderly residents and children with asthma report worsening symptoms. The barangay has never issued a notice to the school. (Air pollution and open burning: RA 8749, the Clean Air Act.)\n\n"+
"Scenario 2: The Missing MRF. Barangay Tagumpay has 4,500 residents but no Materials Recovery Facility. Garbage collectors accept mixed, unsegregated waste from households every Monday and Thursday. Much of it ends up in an open dumpsite at the edge of the barangay. The barangay captain says, \"We have no budget for an MRF.\" Meanwhile, the nearest sanitary landfill is 25 km away and charges a tipping fee that the barangay says it cannot afford. (Solid waste and MRFs: RA 9003, the Ecological Solid Waste Management Act.)\n\n"+
"Scenario 3: The Factory Creek. A textile factory in Barangay Malakas discharges blue wastewater into the community creek, causing skin rashes in children and damaging irrigation water for farms. The barangay captain has not acted due to the factory owner's political connections. (Water pollution: RA 9275, the Clean Water Act.)\n\n"+
"Scenario 4: The Smoke-Belching Jeepney. A traditional jeepney operating on a busy city route visibly emits thick black smoke every time it accelerates. Passengers regularly step off the jeepney coughing. The driver has not had an emission test in three years. The Land Transportation Office (LTO) emission testing center in the city is only open twice a year. (Vehicle emissions: RA 8749, the Clean Air Act. This scenario shows a gap between the law and enforcement capacity.)\n\n"+
"Environmental Violation Report: Learners identify ONE real environmental violation in or near their community and complete a report as if submitting it to the City Environment and Natural Resources Office (CENRO): description, law and provision violated, who is responsible, who should enforce, evidence, action requested, and what happens if not addressed.\n\n"+
"EXPERIENCE 2: WHY ENFORCEMENT FAILS - AND WHAT STRENGTHENS IT\nEssential ideas:\nHaving strong environmental laws is necessary but not sufficient. Enforcement requires political will, adequate funding, trained personnel, and an empowered citizenry.\nCorruption, political connections, understaffing, and community ignorance of rights are the four most common reasons Philippine environmental laws fail to be enforced.\nLocal ordinances - passed by city or municipal councils - can strengthen national laws at the community level, and in some cases have succeeded where national enforcement has failed.\n\n"+
"Enforcement gap analysis:\n- Political connections: Violators with ties to local officials face no consequence; complaints are ignored or suppressed. What has worked: independent environmental prosecutors; CSO monitoring; journalist exposure; DENR regional intervention.\n- Underfunding: City ENROs have 1-3 staff for hundreds of establishments; no vehicles for field inspection. What has worked: dedicated environmental funds in LGU budgets; deputizing barangay officials as pollution monitors.\n- Citizen ignorance: Most Filipinos do not know which agency to call, what law applies, or that they can file a complaint. What has worked: environmental education in schools; barangay information campaigns; LGU \"Know Your Rights\" materials.\n- Weak penalties: Fines are too small relative to industry profits; criminal cases rarely reach court. What has worked: advocacy for penalty increases (RA 9003 fines unchanged since 2001); class action suits by affected communities.\n- Fragmented jurisdiction: Manila Bay is governed by 13 agencies; responsibility gaps allow violators to evade accountability. What has worked: unified task forces (e.g., Manila Bay Task Force); inter-agency MOAs; Supreme Court continuing mandamus.\n\n"+
"Design a Local Environmental Ordinance: As a newly elected Sangguniang Kabataan (SK) official, learners draft an ordinance with a title and purpose, the specific problem, what it requires or prohibits, who enforces it, penalties (fines, community service, warnings), and one incentive for compliance.\n\n"+
"EXPERIENCE 3: CITIZENS AS ENVIRONMENTAL GUARDIANS\nEssential ideas:\nEvery Filipino has a constitutional right to a balanced and healthful ecology (Article II, Section 16, 1987 Constitution). This is not just an aspiration - it is a justiciable right, meaning citizens can go to court to enforce it.\nSeveral legal mechanisms are available to ordinary citizens to enforce environmental rights: filing complaints with DENR or EMB, filing cases through the Writ of Kalikasan, joining or forming a People's Organization, or organizing community environmental monitoring.\nYoung people - students, SK officials, youth organizations - have played a documented role in compelling local governments and businesses to comply with environmental laws.\n\n"+
"Story A: The Barangay Patrol. In Naga City, a barangay environmental patrol composed of volunteers - mostly retired teachers and parents - began monitoring a creek for illegal discharge. They photographed violations, documented dates and times, and submitted reports to the DENR-EMB regional office. Within eight months, three small factories had installed wastewater treatment facilities to avoid fines. The patrol's records were later used as evidence in an administrative case.\n\n"+
"Story B: The Student Complaint. A Grade 10 class in Cagayan de Oro observed that their school canteen's cooking oil was being discharged into the school's drainage system, which connected to a nearby creek. The class wrote a formal letter to the school principal citing RA 9275, proposed a grease trap installation, and requested the issue be included in the school's environmental program. The principal acted within two weeks. The students shared their experience at a regional youth environmental summit.\n\n"+
"Neither the barangay patrol nor the students went to court, which shows there is a range of actions citizens can take before resorting to legal proceedings.\n\n"+
"My Environmental Action Plan: a personal commitment naming the one environmental problem I care about, the law that protects my right, ONE concrete action within 30 days, who I can work with, and what success looks like.\n\n"+
"EVALUATE\nI can apply RA 9003, RA 9275, and RA 8749 to real-life scenarios; evaluate why enforcement remains weak; analyze local ordinances as a frontline tool; and demonstrate awareness of my rights and remedies as a citizen.\n\n"+
"EXTENDED EXPERIENCE\nVisit your CENRO/MENRO and ask about violations filed last year, the most common violations, and the biggest enforcement challenge. Find a 2023-2025 Philippine news story where a citizen, community group, or NGO used RA 9003, RA 9275, or RA 8749 to compel action. Optional: research the Writ of Kalikasan and one Philippine case where it was filed.";

/* ---------- state ---------- */
function seed(){
  var subs = DEFAULT_SUBJECTS.map(function(n,i){ return {id:uid(), name:n, color:COLORS[i%COLORS.length], lessons:[], history:[], weak:{}}; });
  subs[0].lessons.push({id:uid(), label:'EG6', title:'Responses to Environmental Challenges, Part 2', text:EG6});
  return {subjects:subs};
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); if(d && Array.isArray(d.subjects) && d.subjects.length){ return sanitize(d); } }
  }catch(e){ storageOK = false; }
  return null;
}
function sanitize(d){
  d.subjects = d.subjects.filter(function(s){return s && typeof s.name==='string';}).map(function(s,i){
    return {id:s.id||uid(), name:s.name, color:s.color||COLORS[i%COLORS.length],
      lessons:(Array.isArray(s.lessons)?s.lessons:[]).filter(function(l){return l && typeof l.text==='string';}).map(function(l){return {id:l.id||uid(), label:String(l.label||'L'), title:String(l.title||''), text:l.text};}),
      history:Array.isArray(s.history)?s.history.slice(0,25):[], weak:(s.weak&&typeof s.weak==='object')?s.weak:{}};
  });
  if(!d.subjects.length) return seed();
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; $('#storeNote').textContent = 'This browser is not letting Aralan save. Use "Back up my lessons" so you do not lose them.'; }
}
var state = load() || seed();
var ui = {sid: state.subjects[0].id, tab:'ask', sel:{}, busy:false, ctl:null, practice:null, editing:null};

function cur(){ return state.subjects.filter(function(s){return s.id===ui.sid;})[0] || state.subjects[0]; }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},2800); }

/* ---------- talking to your server (api/ask.js) ---------- */
function getCode(){
  var c = '';
  try{ c = localStorage.getItem('aralan:code') || ''; }catch(e){}
  if(!c){ c = (window.prompt('Enter the access code for Aralan:') || '').trim(); }
  return c;
}
function parseLooseJSON(text){
  var t = String(text||'').replace(/```json|```/g,'').trim();
  try{ return JSON.parse(t); }catch(e){}
  var a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw {code:'invalid_json'};
}
async function askClaude(prompt, signal){
  var code = getCode();
  if(!code) throw {code:'bad_code'};
  var res;
  try{
    res = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:prompt, code:code}), signal:signal});
  }catch(e){
    if(e && e.name==='AbortError') throw {code:'cancelled'};
    throw {code:'upstream_error'};
  }
  if(res.status===401){ try{ localStorage.removeItem('aralan:code'); }catch(e){} throw {code:'bad_code'}; }
  if(res.status===429) throw {code:'rate_limited'};
  if(!res.ok) throw {code:'upstream_error'};
  var data = await res.json();
  try{ localStorage.setItem('aralan:code', code); }catch(e){}
  return parseLooseJSON(data.text);
}

/* ---------- lesson selection ---------- */
function pickLessons(subj, q){
  var chosen = subj.lessons.filter(function(l){ return ui.sel[l.id]; });
  if(chosen.length) return {lessons:chosen, how:'manual'};
  var nq = norm(q);
  var found = subj.lessons.filter(function(l){ var nl = norm(l.label); return nl.length>=2 && nq.indexOf(nl)!==-1; });
  if(found.length) return {lessons:found, how:'detected'};
  return {lessons:subj.lessons, how:'all'};
}
function lessonBlock(lessons){
  var BUDGET = 48000, total = 0, truncated = false;
  lessons.forEach(function(l){ total += l.text.length; });
  var per = lessons.length ? Math.floor(BUDGET/lessons.length) : BUDGET;
  var text = lessons.map(function(l){
    var t = l.text;
    if(total>BUDGET && t.length>per){ t = t.slice(0,per); truncated = true; }
    return '=== LESSON ' + l.label + ': ' + l.title + ' ===\n' + t;
  }).join('\n\n');
  return {text:text, truncated:truncated};
}

/* ---------- errors ---------- */
function errCopy(e){
  var c = e && e.code;
  if(c==='bad_code') return 'That access code did not work. Tap the button again to re-enter it.';
  if(c==='rate_limited') return 'Too many requests right now. Wait a bit, then try again.';
  if(c==='prompt_too_large') return 'Your lessons are too long for one request. Pick fewer lessons using the chips above.';
  if(c==='refused') return 'Claude could not answer that one. Try rewording the question.';
  return 'Something went wrong getting an answer. Tap the button to try again.';
}
function noticeHTML(msg){ return '<div class="notice">'+esc(msg)+'</div>'; }

/* ---------- chips ---------- */
function chipsHTML(s){
  if(!s.lessons.length) return '';
  var anySel = s.lessons.some(function(l){return ui.sel[l.id];});
  return '<button type="button" class="chip" data-chip="auto" aria-pressed="'+(!anySel)+'">Auto</button>'+
    s.lessons.map(function(l){ return '<button type="button" class="chip" data-chip="'+esc(l.id)+'" aria-pressed="'+(!!ui.sel[l.id])+'" title="'+esc(l.title)+'">'+esc(l.label)+'</button>'; }).join('');
}
function refreshChips(){
  var c = $('#chips'); if(c) c.innerHTML = chipsHTML(cur());
  updateScopeNote();
}
function updateScopeNote(){
  var n = $('#scopeNote'); if(!n) return;
  var s = cur();
  if(!s.lessons.length){ n.textContent = 'No lessons saved for this subject yet.'; return; }
  var q = $('#q') ? $('#q').value : '';
  var p = pickLessons(s, q);
  var names = p.lessons.map(function(l){return l.label;}).join(', ');
  if(p.how==='manual') n.textContent = 'Reading only: '+names+'.';
  else if(p.how==='detected') n.textContent = 'Found '+names+' in your question, so reading that lesson.';
  else n.textContent = 'Reading all '+p.lessons.length+' lesson'+(p.lessons.length===1?'':'s')+' in '+s.name+'. Type a lesson name like "'+s.lessons[0].label+'" in your question, or tap a chip, to narrow it.';
}

  if(go){ go.disabled = ui.busy; }
  if(st){ st.hidden = !ui.busy; }
  if(pg){ pg.disabled = ui.busy; }

}
function thinking(msg){ return '<div class="panel thinking"><span class="dots"><i></i><i></i><i></i></span><span>'+esc(msg)+'</span></div>'; }

function buildAskPrompt(subj, pick, q, simple){
  var block = lessonBlock(pick.lessons);
  return 'You are a patient study helper for a Grade 10 student in the Philippines. Subject: '+subj.name+'.\n'+
  'Answer the student\'s question using the saved lesson material below.\n\n'+
  'RULES:\n'+
  '- The question may be multiple choice, identification, true/false or open-ended. If choices are given, pick the single best one.\n'+
  '- Ground the answer in the lessons first. In "quote", copy ONE supporting passage from the lesson EXACTLY as written (character for character, at most 30 words). Put that lesson\'s label (e.g. EG6) in "lessonLabel".\n'+
  '- "coverage" is "full" if the lessons clearly answer it, "partial" if they only help, "none" if they do not cover it. If "none" or "partial", answer from general knowledge, leave "quote" empty when nothing fits, and use "note" to say briefly what lesson or topic the student should add or review.\n'+
  '- "explanation": 2 to 4 short sentences that teach the idea so the student could handle a similar question.'+(simple?' Use very simple words and one everyday example.':'')+' For math or science calculations, show the steps briefly.\n'+
  '- "others": for multiple choice, one short reason for each choice that is NOT correct. Empty array otherwise.\n'+
  '- Reply in the same language as the question (English or Filipino).\n'+
  '- If the question text is unclear or has no answer choices, do your best and say so in "note".\n\n'+
  'Reply with ONLY a JSON object, no other text:\n'+
  '{"answerLetter":"B","answerText":"the full text of the correct choice or the answer","explanation":"...","others":[{"choice":"A","reason":"..."}],"lessonLabel":"EG6","quote":"exact words from the lesson","coverage":"full","note":""}\n\n'+
  '--- LESSONS ---\n'+(block.text||'(No lessons saved.)')+'\n\n--- QUESTION ---\n'+q;
}
function normResult(d){
  d = d && typeof d==='object' ? d : {};
  var others = Array.isArray(d.others) ? d.others.filter(function(o){return o && o.reason;}).map(function(o){return {choice:String(o.choice||''), reason:String(o.reason)};}) : [];
  var cov = ['full','partial','none'].indexOf(d.coverage)!==-1 ? d.coverage : 'partial';
  return {answerLetter:String(d.answerLetter||'').trim(), answerText:String(d.answerText||''), explanation:String(d.explanation||''), others:others,
    lessonLabel:String(d.lessonLabel||''), quote:String(d.quote||'').trim(), coverage:cov, note:String(d.note||'')};
}
function findLesson(subj, label){
  var nl = norm(label); if(!nl) return null;
  return subj.lessons.filter(function(l){return norm(l.label)===nl;})[0] || null;
}
function resultHTML(r, subj, extraNote){
  var les = findLesson(subj, r.lessonLabel);
  var covTxt = r.coverage==='full' ? 'From your lesson'+(r.lessonLabel?' '+esc(r.lessonLabel):'') : (r.coverage==='partial' ? 'Partly in your lessons' : 'Not found in your lessons');
  var h = '<section class="panel result"><span class="cov '+r.coverage+'">'+covTxt+'</span>';
  if(r.answerLetter || r.answerText){
    h += '<div class="answer">'+(r.answerLetter?'<div class="letter">'+esc(r.answerLetter)+'</div>':'')+'<div class="atext">'+esc(r.answerText)+'</div></div>';
  }
  if(r.explanation) h += '<h3>Why</h3><p>'+esc(r.explanation)+'</p>';
  if(r.others.length){
    h += '<h3>Why not the others</h3><ul class="others">'+r.others.map(function(o){return '<li><b>'+esc(o.choice)+'</b><span>'+esc(o.reason)+'</span></li>';}).join('')+'</ul>';
  }
  if(r.quote){
    h += '<h3>Where it comes from</h3><blockquote class="src"><mark>'+esc(r.quote)+'</mark></blockquote>'+
      '<div class="srcmeta"><span>'+esc(r.lessonLabel||'Lesson')+'</span>'+(les?'<button type="button" class="linkbtn" data-open="'+esc(les.id)+'" data-quote="'+esc(r.quote)+'">Open in lesson</button>':'')+'</div>';
  }
  if(r.note) h += '<h3>Note</h3><p>'+esc(r.note)+'</p>';
  if(extraNote) h += '<p class="hint">'+esc(extraNote)+'</p>';
  return h+'</section>';
}
function setResult(html){ var r = $('#result'); if(r) r.innerHTML = html; }

async function doAsk(){
  var qEl = $('#q'); if(!qEl) return;
  var q = qEl.value.trim();
  if(!q){ toast('Paste a question first.'); return; }
  var subj = cur();
  var pick = pickLessons(subj, q);
  var simple = !!($('#simple') && $('#simple').checked);
  var block = lessonBlock(pick.lessons);
  ui.ctl = new AbortController(); ui.busy = true; syncBusy();
  setResult(thinking('Reading your lessons...'));
  try{
    var data = await askClaude(buildAskPrompt(subj, pick, q, simple), ui.ctl.signal);
    var r = normResult(data);
    subj.history.unshift({id:uid(), q:q, r:r, ts:Date.now()});
    subj.history = subj.history.slice(0,25);
    save();
    if(ui.sid===subj.id && ui.tab==='ask'){
      setResult(resultHTML(r, subj, block.truncated?'Your lessons were long, so parts were shortened. Pick a single lesson for full detail.':''));
      renderHistory();
    }
  }catch(e){
    if(e && e.code==='cancelled'){ setResult(''); }
    else setResult(noticeHTML(errCopy(e)));
  }finally{
    ui.busy = false; ui.ctl = null; syncBusy();
  }
}
function renderHistory(){
  var p = $('#histPanel'); if(!p) return;
  var s = cur();
  if(!s.history.length){ p.innerHTML = '<h2>Recent questions</h2><p class="hint">Questions you ask will show up here so you can review them later.</p>'; return; }
  p.innerHTML = '<div class="row"><h2>Recent questions</h2><span class="spacer"></span><button type="button" class="linkbtn" id="clearHist">Clear list</button></div><ul class="hist">'+
    s.history.map(function(h){ return '<li><button type="button" data-hist="'+esc(h.id)+'"><span class="hq">'+esc(h.q.split('\n')[0].slice(0,120))+'</span><span class="ha">'+esc(h.r.answerLetter||'')+'</span></button></li>'; }).join('')+'</ul>';
}

async function doPractice(){
  var s = cur();
  var chosen = s.lessons.filter(function(l){return ui.sel[l.id];});
  var lessons = chosen.length ? chosen : s.lessons;
  if(!lessons.length){ toast('Add a lesson first.'); return; }
  var block = lessonBlock(lessons);
  var prompt = 'You write practice exams for a Grade 10 student in the Philippines. Subject: '+s.name+'.\n'+
   'Using ONLY the lesson material below, write 5 multiple-choice questions in the style of a school exam: mix recall with questions that apply the ideas to a short situation.\n'+
   'Each question has exactly 4 choices, one correct. Spread the correct answer across different positions. Make wrong choices believable, not silly. Write in the same language as the lesson.\n'+
   '"topic" is a 2 to 5 word name for the idea being tested. "explanation" is 1 or 2 short sentences on why the answer is right.\n\n'+
   'Reply with ONLY a JSON array, no other text:\n[{"q":"question text","choices":["choice 1","choice 2","choice 3","choice 4"],"answerIndex":0,"explanation":"...","topic":"...","lessonLabel":"EG6"}]\n\n--- LESSONS ---\n'+block.text;
  ui.ctl = new AbortController(); ui.busy = true; syncBusy();
  var pv2 = $('#pview'); if(pv2) pv2.innerHTML = thinking('Writing your questions...');
  try{
    var data = await askClaude(prompt, ui.ctl.signal);
    var items = (Array.isArray(data)?data:[]).filter(function(x){
      return x && typeof x.q==='string' && Array.isArray(x.choices) && x.choices.length>=2 && Number.isInteger(x.answerIndex) && x.answerIndex>=0 && x.answerIndex<x.choices.length;
    }).slice(0,5);
    if(!items.length) throw {code:'invalid_json'};
    ui.practice = {sid:s.id, items:items, done:{}};
    if(ui.sid===s.id && ui.tab==='practice') renderPracticeItems();
  }catch(e){
    var pv3 = $('#pview');
    if(e && e.code==='cancelled'){ if(pv3) pv3.innerHTML=''; }
    else if(pv3) pv3.innerHTML = noticeHTML(errCopy(e));
  }finally{
    ui.busy = false; ui.ctl = null; syncBusy();
  }
}
function renderPracticeItems(){
  var pv = $('#pview'); if(!pv) return;
  var p = ui.practice;
  if(!p || p.sid!==ui.sid){ pv.innerHTML=''; return; }
  var L = 'ABCDEFGH';
  var answered = Object.keys(p.done).length;
  var right = 0; Object.keys(p.done).forEach(function(k){ if(p.done[k]===p.items[k].answerIndex) right++; });
  var h = '<div class="score">'+right+' correct \u00b7 '+answered+' of '+p.items.length+' answered</div>';
  p.items.forEach(function(it,i){
    var d = p.done[i]; var isDone = d!==undefined;
    h += '<article class="q"><div class="q-top"><span>Question '+(i+1)+'</span><span>'+esc(it.topic||'')+'</span></div><h3>'+esc(it.q)+'</h3><div class="opts">'+
      it.choices.map(function(c,j){
        var cls = 'opt'; if(isDone){ if(j===it.answerIndex) cls+=' right'; else if(j===d) cls+=' wrong'; }
        return '<button type="button" class="'+cls+'" data-pq="'+i+'" data-pc="'+j+'" '+(isDone?'disabled':'')+'><b>'+L[j]+'.</b><span>'+esc(String(c).replace(/^[A-Da-d][\.\)]\s+/,''))+'</span></button>';
      }).join('')+'</div>';
    if(isDone){ h += '<div class="why"><b>'+(d===it.answerIndex?'Correct. ':'Not quite. The answer is '+L[it.answerIndex]+'. ')+'</b>'+esc(it.explanation||'')+'</div>'; }
    h += '</article>';
  });
  if(answered===p.items.length){ h += '<div class="row"><button type="button" class="primary" id="againPractice">Make 5 new questions</button></div>'; }
  pv.innerHTML = h;
}

function saveLesson(){
  var s = cur();
  var label = $('#lLabel').value.trim(), title = $('#lTitle').value.trim(), text = $('#lText').value.trim();
  if(text.length<20){ toast('Paste some lesson text first.'); return; }
  if(!label) label = 'L'+(s.lessons.length+1);
  if(ui.editing){
    var l = s.lessons.filter(function(x){return x.id===ui.editing;})[0];
    if(l){ l.label=label; l.title=title; l.text=text; }
    ui.editing = null; toast('Lesson updated.');
  }else{
    s.lessons.push({id:uid(), label:label, title:title, text:text}); toast('Lesson saved.');
  }
  save(); renderAll();
}

/* ---------- reader dialog ---------- */
function highlighted(text, quote){
  if(!quote) return esc(text);
  var i = text.indexOf(quote), len = quote.length;
  if(i<0){
    var parts = quote.trim().split(/\s+/).map(function(p){ return p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
    try{ var m = new RegExp(parts.join('\\s+'),'i').exec(text); if(m){ i=m.index; len=m[0].length; } }catch(e){}
  }
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark id="hit">'+esc(text.slice(i,i+len))+'</mark>'+esc(text.slice(i+len));
}
function openReader(id, quote){
  var l = null; state.subjects.forEach(function(s){ s.lessons.forEach(function(x){ if(x.id===id) l = x; }); });
  if(!l) return;
  $('#readerLabel').textContent = l.label; $('#readerTitle').textContent = l.title || 'Lesson';
  $('#readerBody').innerHTML = highlighted(l.text, quote);
  var d = $('#reader');
  try{ if(!d.open) d.showModal(); }catch(e){ d.setAttribute('open',''); }
  var hit = $('#hit'); if(hit){ setTimeout(function(){ try{ hit.scrollIntoView({block:'center'}); }catch(e){} }, 50); }
  else { d.scrollTop = 0; }
}

/* ---------- events ---------- */
var armed = {};
function arm(btn, key, armedText){
  if(armed[key]){ clearTimeout(armed[key].t); delete armed[key]; return true; }
  var old = btn.textContent; btn.textContent = armedText;
  armed[key] = {t:setTimeout(function(){ btn.textContent = old; delete armed[key]; }, 3500)};
  return false;
}
document.addEventListener('click', function(e){
  var t = e.target.closest('button, [data-open]'); if(!t) return;
  var s = cur();
  if(t.dataset.sid){ ui.sid = t.dataset.sid; ui.sel = {}; ui.editing = null; renderAll(); return; }
  if(t.dataset.tab){ ui.tab = t.dataset.tab; ui.editing = null; renderMain(); return; }
  if(t.id==='addOpen'){
    var a = $('#addsubj'); a.dataset.open = '1';
    a.innerHTML = '<form id="addForm"><input id="newSubj" maxlength="30" placeholder="Subject name" aria-label="Subject name"><button class="primary" type="submit">Add</button></form>';
    $('#newSubj').focus(); return;
  }
  if(t.dataset.chip){
    if(t.dataset.chip==='auto') ui.sel = {}; else ui.sel[t.dataset.chip] = !ui.sel[t.dataset.chip];
    refreshChips();
    if(ui.tab==='practice'){ var n=$('#scopeNote'); if(n) n.textContent = Object.keys(ui.sel).some(function(k){return ui.sel[k];}) ? 'Testing only the lessons you tapped.' : 'Testing on all '+s.lessons.length+' lesson'+(s.lessons.length===1?'':'s')+'.'; }
    return;
  }
  if(t.id==='goAsk'){ doAsk(); return; }
  if(t.id==='stopAsk' || t.id==='stopPractice'){ if(ui.ctl) ui.ctl.abort(); return; }
  if(t.id==='clearQ'){ $('#q').value=''; setResult(''); updateScopeNote(); $('#q').focus(); return; }
  if(t.dataset.hist){
    var h = s.history.filter(function(x){return x.id===t.dataset.hist;})[0];
    if(h){ $('#q').value = h.q; setResult(resultHTML(h.r, s)); updateScopeNote(); window.scrollTo({top:0,behavior:'smooth'}); }
    return;
  }
  if(t.id==='clearHist'){ s.history = []; save(); renderHistory(); return; }
  if(t.dataset.open){ openReader(t.dataset.open, t.dataset.quote); return; }
  if(t.id==='goPractice' || t.id==='againPractice'){ doPractice(); return; }
  if(t.dataset.pq!==undefined){
    var p = ui.practice; if(!p) return;
    var qi = +t.dataset.pq, ci = +t.dataset.pc;
    if(p.done[qi]!==undefined) return;
    p.done[qi] = ci;
    var it = p.items[qi];
    if(ci!==it.answerIndex){ var topic = (it.topic||'General').slice(0,40); s.weak[topic] = (s.weak[topic]||0)+1; save(); }
    renderPracticeItems(); renderWeak(); return;
  }
  if(t.id==='clearWeak'){ s.weak = {}; save(); renderWeak(); return; }
  if(t.id==='saveLesson'){ saveLesson(); return; }
  if(t.id==='cancelEdit'){ ui.editing = null; renderLessons(); return; }
  if(t.dataset.read){ openReader(t.dataset.read); return; }
  if(t.dataset.edit){ ui.editing = t.dataset.edit; renderLessons(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.del){
    if(arm(t, 'del'+t.dataset.del, 'Tap again to delete')){
      s.lessons = s.lessons.filter(function(l){return l.id!==t.dataset.del;}); delete ui.sel[t.dataset.del]; save(); renderAll(); toast('Lesson deleted.');
    }
    return;
  }
  if(t.id==='delSubject'){
    if(arm(t, 'delsubj', 'Tap again to delete '+s.name)){
      state.subjects = state.subjects.filter(function(x){return x.id!==s.id;}); ui.sid = state.subjects[0].id; ui.sel = {}; save(); renderAll(); toast('Subject deleted.');
    }
    return;
  }
  if(t.id==='readerClose'){ var d=$('#reader'); try{ d.close(); }catch(err){ d.removeAttribute('open'); } return; }
  if(t.id==='backup'){ doBackup(); return; }
  if(t.id==='restore'){ $('#restoreFile').click(); return; }
});
document.addEventListener('submit', function(e){
  if(e.target.id==='addForm'){
    e.preventDefault();
    var name = $('#newSubj').value.trim(); if(!name) return;
    var ns = {id:uid(), name:name, color:COLORS[state.subjects.length%COLORS.length], lessons:[], history:[], weak:{}};
    state.subjects.push(ns); ui.sid = ns.id; ui.tab = 'lessons'; ui.sel = {};
    var a = $('#addsubj'); delete a.dataset.open; save(); renderAll();
  }
});
document.addEventListener('input', function(e){ if(e.target.id==='q') updateScopeNote(); });
document.addEventListener('change', function(e){
  if(e.target.id==='lFile'){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ $('#lText').value = String(rd.result||''); if(!$('#lTitle').value) $('#lTitle').value = f.name.replace(/\.[^.]+$/,''); };
    rd.readAsText(f);
  }
  if(e.target.id==='restoreFile'){
    var g = e.target.files && e.target.files[0]; if(!g) return;
    var r2 = new FileReader();
    r2.onload = function(){
      try{
        var d = JSON.parse(String(r2.result||''));
        if(!d || !Array.isArray(d.subjects)) throw new Error('bad');
        state = sanitize(d); ui.sid = state.subjects[0].id; ui.sel = {}; ui.practice = null; save(); renderAll(); toast('Backup restored.');
      }catch(err){ toast('That file is not an Aralan backup.'); }
      e.target.value = '';
    };
    r2.readAsText(g);
  }
});
$('#reader').addEventListener('click', function(e){ if(e.target===this){ try{ this.close(); }catch(err){ this.removeAttribute('open'); } } });

function doBackup(){
  try{
    var blob = new Blob([JSON.stringify(state,null,1)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'aralan-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }catch(e){ toast('Could not save the backup file.'); }
}

/* ---------- start ---------- */
renderAll();
})();

// Vercel serverless function: keeps your API key off the page.
// Set these in Vercel > Project > Settings > Environment Variables:
//   ANTHROPIC_API_KEY  - your key from the Claude Platform
//   ACCESS_CODE        - a password you share with your friends
//   MODEL              - optional, defaults to claude-sonnet-5

module.exports = async function handler(req, res) {
  if (req.method !== 'POST') return res.status(405).json({ error: 'POST only' });

  const { prompt, code } = req.body || {};
  if (!process.env.ACCESS_CODE || code !== process.env.ACCESS_CODE) {
    return res.status(401).json({ error: 'bad_code' });
  }
  if (typeof prompt !== 'string' || !prompt.trim() || prompt.length > 70000) {
    return res.status(400).json({ error: 'bad_prompt' });
  }

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': process.env.ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: process.env.MODEL || 'claude-sonnet-5',
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (r.status === 429) return res.status(429).json({ error: 'rate_limited' });
    if (!r.ok) return res.status(502).json({ error: 'upstream_error' });
    const data = await r.json();
    const text = (data.content || []).map(b => (b.type === 'text' ? b.text : '')).join('');
    return res.status(200).json({ text });
  } catch (e) {
    return res.status(502).json({ error: 'upstream_error' });
  }
};
